stages: [test, image]

variables:
  # This will suppress any download for dependencies and plugins or upload messages which would clutter the console log.
  # `showDateTime` will show the passed time in milliseconds. You need to specify `--batch-mode` to make this work.
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=INFO -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  # `installAtEnd` and `deployAtEnd` are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: "--batch-mode -s .m2/settings.xml --errors --fail-at-end --show-version -DinstallAtEnd=true  -Dmaven.test.skip=true"


default:
  image: maven:3.9.9-eclipse-temurin-21
  cache:
    key: maven
    paths:
      - .m2/repository

maven:test:
  stage: test
  before_script:
    - chmod +x mvnw
  script:
    - ./mvnw -B -ntp test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  artifacts:
    when: always
    reports:
      junit: "**/target/surefire-reports/*.xml"

